<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f1117" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Notre Agenda" />
<title>Notre Agenda</title>
<style>
  :root {
    --bg:       #0f1117;
    --card:     #1a1d27;
    --card2:    #21253a;
    --border:   #2d3148;
    --text:     #e2e8f0;
    --muted:    #8892a4;
    --accent:   #4f6ef7;

    /* Une couleur par source : c'est la clé de lecture de toute l'app */
    --chrono:   #f97316;
    --perso:    #22c55e;

    --radius:   10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }

  button { font-family: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ═══ ÉCRAN DE CODE ═══════════════════════════════════════════ */

  .gate {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .gate-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 26px;
    width: 100%; max-width: 340px;
    text-align: center;
  }
  .gate-box h1 { font-size: 1.4rem; margin-bottom: 6px; }
  .gate-box p  { color: var(--muted); font-size: .85rem; margin-bottom: 22px; }

  .gate-box input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 13px 14px;
    font-size: 1.05rem;
    text-align: center;
    letter-spacing: .12em;
    margin-bottom: 12px;
  }
  .gate-box button {
    width: 100%;
    background: var(--accent);
    border: 0; border-radius: var(--radius);
    color: #fff;
    padding: 13px;
    font-size: .95rem; font-weight: 600;
  }
  .gate-box button:disabled { opacity: .5; cursor: default; }
  .gate-err {
    color: #f87171; font-size: .82rem; margin-top: 12px;
    min-height: 1.2em;
  }

  /* ═══ HEADER ══════════════════════════════════════════════════ */

  .header {
    background: linear-gradient(135deg, #1a1d27 0%, #21253a 100%);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    position: sticky; top: 0; z-index: 20;
  }
  .header-top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 12px;
  }
  .header h1 { font-size: 1.1rem; font-weight: 700; }
  .header .sub { color: var(--muted); font-size: .72rem; margin-top: 1px; }

  .btn-icon {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    width: 34px; height: 34px;
    font-size: 1rem;
    display: grid; place-items: center;
  }
  .btn-icon:active { transform: scale(.94); }

  /* Sélecteur de vue */
  .tabs {
    display: flex; gap: 4px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 3px;
  }
  .tab {
    flex: 1;
    background: transparent; border: 0;
    color: var(--muted);
    padding: 7px 6px;
    border-radius: 6px;
    font-size: .78rem; font-weight: 600;
    white-space: nowrap;
  }
  .tab[aria-selected="true"] { background: var(--card2); color: var(--text); }

  /* Filtres par source */
  .filters {
    display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap;
  }
  .filt {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    padding: 5px 11px;
    font-size: .74rem; font-weight: 600;
    transition: opacity .15s;
  }
  .filt .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: currentColor;
  }
  .filters[hidden] { display: none; }
  .filt[aria-pressed="false"] { opacity: .38; }
  .filt.chrono { color: var(--chrono); }
  .filt.perso  { color: var(--perso);  }

  /* ═══ CONTENU ═════════════════════════════════════════════════ */

  .wrap { padding: 14px 16px 40px; max-width: 780px; margin: 0 auto; }

  .state {
    text-align: center; color: var(--muted);
    padding: 50px 20px; font-size: .9rem;
  }
  .state strong { display: block; color: var(--text); margin-bottom: 6px; }

  .warn {
    background: #78350f33;
    border: 1px solid #f59e0b55;
    border-radius: var(--radius);
    color: #fbbf24;
    padding: 10px 12px;
    font-size: .78rem;
    margin-bottom: 14px;
  }

  /* ─── Vue liste ─── */

  .month-sep {
    color: var(--muted);
    font-size: .72rem; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    margin: 22px 0 10px; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .month-sep:first-child { margin-top: 0; }

  .ev {
    display: flex; gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 13px;
    margin-bottom: 8px;
    text-decoration: none; color: inherit;
  }
  .ev.chrono { border-left-color: var(--chrono); }
  .ev.perso  { border-left-color: var(--perso);  }
  .ev.today  { background: var(--card2); }

  .ev-date {
    flex-shrink: 0; width: 44px; text-align: center;
  }
  .ev-day {
    font-size: 1.3rem; font-weight: 700; line-height: 1.1;
  }
  .ev-dow {
    font-size: .64rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .ev-body { flex: 1; min-width: 0; }
  .ev-title {
    font-size: .92rem; font-weight: 600;
    margin-bottom: 3px; line-height: 1.3;
  }
  .ev-meta {
    color: var(--muted); font-size: .74rem;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .ev-tags { margin-top: 7px; display: flex; gap: 4px; flex-wrap: wrap; }
  .tag {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--muted);
    padding: 2px 6px;
    font-size: .66rem;
  }
  .tag.t-techno { color: #7dd3fc; border-color: #38bdf855; }
  .tag.t-type   { color: #c4b5fd; border-color: #a78bfa55; }
  .tag.t-mat    { color: var(--muted); }
  .tag.t-tache  { color: #fcd34d; border-color: #f59e0b55; }
  .ev-team { margin-top: 6px; font-size: .78rem; }
  .ev-team.solo { color: var(--muted); }
  .badge-today {
    background: var(--accent); color: #fff;
    border-radius: 4px; padding: 1px 5px;
    font-size: .62rem; font-weight: 700;
    letter-spacing: .04em;
  }

  /* ─── Vue calendrier ─── */

  .cal-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .cal-nav h2 {
    font-size: 1rem; font-weight: 700; text-transform: capitalize;
  }
  .cal-nav div { display: flex; gap: 6px; }

  .cal-grid {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 3px;
  }
  .cal-dow {
    text-align: center; color: var(--muted);
    font-size: .64rem; font-weight: 700;
    text-transform: uppercase; padding-bottom: 5px;
  }
  .cal-cell {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 7px;
    min-height: 62px;
    padding: 4px 4px 3px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .cal-cell.out   { opacity: .3; }
  .cal-cell.we    { background: #1a1d2799; }
  .cal-cell.today { border-color: var(--accent); }

  .cal-num {
    font-size: .68rem; color: var(--muted);
    font-weight: 600; text-align: right; line-height: 1;
  }
  .cal-cell.today .cal-num { color: var(--accent); }

  .cal-ev {
    background: var(--card2);
    border-left: 2px solid var(--border);
    border-radius: 3px;
    font-size: .58rem;
    padding: 1px 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    cursor: pointer;
  }
  .cal-ev.chrono { border-left-color: var(--chrono); color: #fdba74; }
  .cal-ev.perso  { border-left-color: var(--perso);  color: #86efac; }
  .cal-more { font-size: .55rem; color: var(--muted); padding-left: 3px; }

  /* ─── Détail (clic sur un événement du calendrier) ─── */

  .sheet {
    position: fixed; inset: 0;
    background: #000c;
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 50;
    padding: 0;
  }
  .sheet-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    padding: 20px 18px 26px;
    width: 100%; max-width: 480px;
  }
  .sheet-box h3 { font-size: 1rem; margin-bottom: 8px; }
  .sheet-box .ev-meta { margin-bottom: 12px; }
  .sheet-box a {
    display: block; text-align: center;
    background: var(--card2); border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text); text-decoration: none;
    padding: 10px; font-size: .85rem; font-weight: 600;
    margin-top: 10px;
  }

  /* ═══ TABLEAU DE BORD ═════════════════════════════════════════ */

  :root {
    --st-valide:  #22c55e;
    --st-option:  #f59e0b;
    --st-reporte: #a78bfa;
    --st-annule:  #f87171;
    --st-perdu:   #6b7280;
    --st-autre:   #8892a4;
  }

  .seg {
    display: flex; gap: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 3px;
    margin-bottom: 12px;
  }
  .seg button {
    flex: 1;
    background: transparent; border: 0;
    color: var(--muted);
    padding: 8px 10px; border-radius: 6px;
    font-size: .82rem; font-weight: 600;
  }
  .seg button[aria-pressed="true"] { background: var(--card2); color: var(--text); }

  .st-filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .st-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--muted);
    padding: 5px 11px;
    font-size: .74rem; font-weight: 600;
  }
  .st-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .st-chip[aria-pressed="false"] { opacity: .38; }
  .st-chip .n { opacity: .75; font-variant-numeric: tabular-nums; }
  .filt[hidden] { display: none; }
  .btn-icon:disabled { opacity: .3; cursor: default; }

  .st-valide  { --c: var(--st-valide);  }
  .st-option  { --c: var(--st-option);  }
  .st-nonsigne { --c: #fb923c; }
  .st-reporte { --c: var(--st-reporte); }
  .st-annule  { --c: var(--st-annule);  }
  .st-perdu   { --c: var(--st-perdu);   }
  .st-autre   { --c: var(--st-autre);   }
  .st-chip.st-valide, .st-chip.st-option, .st-chip.st-nonsigne, .st-chip.st-reporte,
  .st-chip.st-annule, .st-chip.st-perdu,  .st-chip.st-autre { color: var(--c); }

  .ev[class*="st-"]     { border-left-color: var(--c); }
  .cal-ev[class*="st-"] { border-left-color: var(--c); color: var(--text); }
  .st-annule .ev-title, .st-perdu .ev-title, .st-reporte .ev-title { opacity: .6; }

  .kpis {
    display: grid; gap: 8px; margin-bottom: 14px;
    grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
  }
  .kpi {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 12px;
  }
  .kpi b { display: block; font-size: 1.5rem; line-height: 1.1; }
  .kpi span { color: var(--muted); font-size: .7rem; }
  .kpi.alert { border-color: #f59e0b88; }
  .kpi.alert b { color: #fbbf24; }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 12px 8px;
    margin-bottom: 16px;
  }
  .panel h3 {
    font-size: .72rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
    margin-bottom: 10px;
  }
  .bars {
    display: grid; grid-template-columns: repeat(12, 1fr);
    gap: 4px; height: 140px; align-items: end;
  }
  .bar-col {
    display: flex; flex-direction: column; justify-content: flex-end;
    align-items: center; height: 100%; gap: 3px;
  }
  .bar-val { font-size: .62rem; color: var(--muted); min-height: 1em; }
  .bar {
    width: 100%; max-width: 22px; display: flex; flex-direction: column;
    justify-content: flex-end; border-radius: 3px 3px 0 0; overflow: hidden;
    background: var(--card2);
  }
  .bar i { display: block; width: 100%; }
  .bar .b-mine   { background: var(--chrono); }
  .bar .b-others { background: #4a5170; }
  .bar-lbl { font-size: .58rem; color: var(--muted); margin-top: 4px; text-align: center; }
  .bar-col.cur .bar-lbl { color: var(--accent); font-weight: 700; }
  .bar-moi { font-size: .68rem; font-weight: 700; color: var(--chrono); margin-top: 2px; line-height: 1.1; }
  .bar-moi:empty { display: none; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: .68rem; color: var(--muted); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }

  /* ── Statistiques ── */
  .panel h4 { font-size: .7rem; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
  .note { font-size: .74rem; color: var(--muted); padding: 4px 0 6px; }
  .note.ok { color: var(--perso); }
  .hbars { display: grid; gap: 7px; }
  .hrow { display: grid; grid-template-columns: 100px 1fr auto; gap: 8px; align-items: center; font-size: .76rem; border-radius: 6px; }
  .hrow.sel { background: var(--card2); }
  .hbars.wide .hrow { grid-template-columns: minmax(120px, 44%) 1fr auto; }
  .hl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ht { height: 9px; background: var(--card2); border-radius: 5px; overflow: hidden; display: block; }
  .ht i { display: block; height: 100%; border-radius: 5px; background: #4a5170; }
  .ht i.h-moi { background: var(--chrono); }
  .ht i.h-autres { background: #4a5170; }
  .ht i.h-autres > i.h-moi { border-radius: 5px 0 0 5px; }
  .ht i.h-type  { background: #a78bfa; }
  .ht i.h-techno { background: #38bdf8; }
  .ht i.h-mat   { background: #8892a4; }
  .ht i.h-tache { background: #f59e0b; }
  .hn { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; min-width: 28px; }
  .hn small { display: block; font-weight: 400; color: var(--muted); font-size: .6rem; white-space: nowrap; }
  .chips-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chips-row .tag b { margin-left: 3px; color: var(--text); }
  .tag.t-warn { color: #fbbf24; border-color: #f59e0b66; }

  .mini { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border);
          text-decoration: none; color: inherit; }
  .mini:first-of-type { border-top: 0; padding-top: 2px; }
  .mini .jx { min-width: 54px; text-align: center; font-size: .72rem; font-weight: 800; color: var(--c, var(--accent));
              background: var(--card2); border-radius: 6px; padding: 5px 4px; }
  .mini .mt { font-size: .84rem; font-weight: 600; min-width: 0; }
  .mini .mt small { display: block; color: var(--muted); font-weight: 400; font-size: .68rem; margin-top: 2px; }
  .al { font-size: .78rem; padding: 4px 0; color: #fcd34d; }
  .delta { background: var(--card2); border-radius: 8px; padding: 8px 10px; font-size: .76rem; margin: 2px 0 10px; line-height: 1.45; }
  .delta span { color: var(--muted); }
  .delta.up > span:last-child { color: var(--perso); font-weight: 700; }
  .delta.down > span:last-child { color: #f87171; font-weight: 700; }

  .heatwrap { overflow: hidden; }
  .heatm { position: relative; height: 13px; font-size: .56rem; color: var(--muted); }
  .heatm span { position: absolute; top: 0; }
  .heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 2px; }
  .heat i, .heatleg i { display: block; aspect-ratio: 1; border-radius: 2px; background: var(--card2); }
  .heat i.vide { background: transparent; }
  .heat i.auj { outline: 1.5px solid var(--text); outline-offset: 0; }
  .h1 { background: color-mix(in srgb, var(--chrono) 30%, var(--card2)) !important; }
  .h2 { background: color-mix(in srgb, var(--chrono) 55%, var(--card2)) !important; }
  .h3 { background: color-mix(in srgb, var(--chrono) 80%, var(--card2)) !important; }
  .h4 { background: var(--chrono) !important; }
  .heatleg { display: inline-flex; gap: 3px; align-items: center; }
  .heatleg i { width: 9px; height: 9px; margin: 0; }

  .stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--card2); gap: 1px; }
  .stack i { display: block; background: var(--c); }
  .stlist { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0; font-size: .74rem; }
  .stlist span { color: var(--c); display: inline-flex; align-items: center; gap: 5px; }
  .stlist span i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); display: block; }
  .stlist b { color: var(--text); }

  .recs { margin-top: 10px; display: grid; gap: 6px; }
  .rec { display: flex; justify-content: space-between; gap: 10px; background: var(--card2); border-radius: 8px;
         padding: 8px 10px; font-size: .76rem; }
  .rec span { color: var(--muted); }
  .rec b { text-align: right; }

  .badge {
    border-radius: 4px; padding: 1px 6px;
    font-size: .62rem; font-weight: 700; letter-spacing: .03em;
  }
  .badge.moi  { background: var(--chrono); color: #1a0f05; }
  .badge.stat { background: transparent; border: 1px solid var(--c); color: var(--c); }
  .no-team { color: #fbbf24; }

  @media (min-width: 640px) {
    .sheet { align-items: center; padding: 20px; }
    .sheet-box { border-radius: 14px; }
    .cal-cell { min-height: 84px; }
    .cal-ev { font-size: .64rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<!-- ═══ ÉCRAN DE CODE ═══ -->
<div class="gate" id="gate">
  <div class="gate-box">
    <h1>Notre Agenda</h1>
    <p>Entre le code d'accès</p>
    <input id="codeInput" type="password" inputmode="numeric"
           autocomplete="off" placeholder="••••" aria-label="Code d'accès" />
    <button id="gateBtn">Ouvrir</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app" hidden>
  <header class="header">
    <div class="header-top">
      <div>
        <h1>Notre Agenda</h1>
        <div class="sub" id="sub">—</div>
      </div>
      <button class="btn-icon" id="btnRefresh" aria-label="Actualiser">&#8635;</button>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabList" aria-selected="true">Liste</button>
      <button class="tab" role="tab" id="tabCal"  aria-selected="false">Calendrier</button>
      <button class="tab" role="tab" id="tabDash" aria-selected="false">Tableau de bord</button>
    </div>

    <div class="filters" id="srcFilters">
      <button class="filt chrono" data-src="notion"  aria-pressed="true"><span class="dot"></span>Chronos</button>
      <button class="filt perso"  data-src="google"  aria-pressed="true"><span class="dot"></span>Perso</button>
    </div>
  </header>

  <main class="wrap" id="main"></main>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
//  État
// ══════════════════════════════════════════════════════════════════

const API = '/api/agenda';

let CODE    = '';
let EVENTS  = [];
let ERRORS  = [];
let VIEW    = 'list';
let ACTIVE  = { notion: true, google: true };
let CAL_REF = new Date();

// Tableau de bord (tous les chronos Notion)
let DASH        = [];            // événements bruts
let DASH_LOADED = false;
let DASH_ERR    = '';
let DASH_SCOPE  = 'all';         // 'all' | 'mine'
let DASH_SUB    = 'stats';       // 'stats' | 'list' | 'cal'
let DASH_ST     = {};            // { 'Validé': true, ... } — complété au fil des chargements
let DASH_YEAR   = new Date().getFullYear();
let DASH_WHEN   = 'upcoming';    // année en cours : 'upcoming' (à venir) | 'all' (toute l'année)
const DASH_CACHE = {};           // année -> événements déjà chargés
let   PERDUS_LIST = null;        // fiches perdues/annulées/reportées sans date (chargées une fois), avec leur année
const YEAR_MIN  = 2022;          // début des archives Oxybol dans Notion
const YEAR_MAX  = new Date().getFullYear() + 4;
let CUR_LIST    = EVENTS;        // liste dans laquelle le calendrier retrouve ses événements

const STATUTS_ORDRE   = ['Validé', 'Validé non signé', 'Option', 'Reporté', 'Annulé', 'Perdu'];
const STATUTS_DEFAUT  = ['Validé', 'Validé non signé', 'Option'];

const DOW    =['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DOW_S  = ['dim','lun','mar','mer','jeu','ven','sam'];
const MONTHS = ['janvier','février','mars','avril','mai','juin',
                'juillet','août','septembre','octobre','novembre','décembre'];

const TODAY = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();

const CLS = { notion: 'chrono', google: 'perso' };
const LBL = { notion: 'Chrono', google: 'Perso' };

// ══════════════════════════════════════════════════════════════════
//  Utilitaires
// ══════════════════════════════════════════════════════════════════

const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function dayOf(s) {
  if (!s) return null;
  const d = new Date(s.slice(0,10) + 'T00:00:00');
  return isNaN(d) ? null : d;
}

function heure(ev) {
  if (ev.allDay || !ev.start.includes('T')) return '';
  const h = ev.start.slice(11,16);
  const f = ev.end && ev.end.includes('T') ? ev.end.slice(11,16) : '';
  return f ? `${h} – ${f}` : h;
}

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear()
      && a.getMonth()    === b.getMonth()
      && a.getDate()     === b.getDate();
}

/** Un événement occupe-t-il ce jour ? (gère les événements sur plusieurs jours) */
function couvre(ev, jour) {
  const d = dayOf(ev.start);
  if (!d) return false;
  let f = dayOf(ev.end) || d;
  // Google exclut le dernier jour d'un all-day, Notion l'inclut.
  if (ev.allDay && ev.end && f > d && ev.source === 'google') {
    f = new Date(f.getTime() - 86400000);
  }
  return jour >= d && jour <= f;
}

const visibles = () => EVENTS.filter(e => ACTIVE[e.source]);

/** Classe CSS d'un événement : par source dans l'agenda, par statut dans le tableau de bord. */
/** Mon nom tel qu'il apparaît dans Notion (déduit de mes chronos : équipe moins « les autres »). */
function monNom() {
  for (const liste of [DASH, ...Object.values(DASH_CACHE), EVENTS]) {
    for (const e of liste || []) {
      if (e.mine && Array.isArray(e.autres)) {
        const n = (e.chronometreurs || []).find(x => !e.autres.includes(x));
        if (n) return n;
      }
    }
  }
  return '';
}

function stSlug(s) {
  const n = (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  if (n === 'valide non signe') return 'nonsigne';
  return ['valide', 'option', 'reporte', 'annule', 'perdu'].includes(n) ? n : 'autre';
}
const clsEv = e => VIEW === 'dash' ? 'st-' + stSlug(e.statut) : CLS[e.source];

/** Événements du tableau de bord après application de la portée et des statuts. */
function dashVisibles() {
  return DASH.filter(e =>
    (DASH_SCOPE === 'all' || e.mine) &&
    DASH_ST && DASH_ST[e.statut || '—'] !== false
  );
}

// ══════════════════════════════════════════════════════════════════
//  Chargement
// ══════════════════════════════════════════════════════════════════

async function charger(silencieux = false) {
  if (!silencieux) {
    document.getElementById('main').innerHTML =
      '<div class="state">Chargement de l\'agenda…</div>';
  }

  try {
    const r = await fetch(`${API}?code=${encodeURIComponent(CODE)}`,
                          { cache: 'no-store' });

    if (r.status === 401) { deconnexion(); return; }
    if (!r.ok) throw new Error('HTTP ' + r.status);

    const d = await r.json();
    EVENTS = d.events || [];
    ERRORS = d.errors || [];
    // L'agenda Google perso n'existe que pour Christophe : pas de pastille « Perso » pour les autres
    const fg = document.querySelector('.filt[data-src="google"]');
    if (fg) fg.hidden = !!d.profil && d.profil !== 'christophe';

    document.getElementById('sub').textContent =
      `${EVENTS.length} événements · maj ${d.last_update || '—'}`;

    rendre();

  } catch (e) {
    document.getElementById('main').innerHTML =
      `<div class="state"><strong>Chargement impossible</strong>
       ${esc(e.message)}<br>Vérifie ta connexion et réessaie.</div>`;
  }
}

function ordreStatut(a, b) {
  const ia = STATUTS_ORDRE.indexOf(a), ib = STATUTS_ORDRE.indexOf(b);
  return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
}

function dashSousTitre(maj) {
  document.getElementById('sub').textContent =
    `${DASH.length} chronos ${DASH_YEAR}` + (maj ? ` · maj ${maj}` : '');
}

async function chargerDash(silencieux = false, force = false) {
  const an = DASH_YEAR;

  if (!force && DASH_CACHE[an]) {
    DASH = DASH_CACHE[an]; DASH_ERR = ''; DASH_LOADED = true;
    dashSousTitre();
    if (VIEW === 'dash') rendre();
    return;
  }

  if (!silencieux) {
    document.getElementById('main').innerHTML =
      `<div class="state">Chargement des chronos ${an}…</div>`;
  }

  try {
    const r = await fetch(`${API}?code=${encodeURIComponent(CODE)}&mode=chronos&year=${an}`,
                          { cache: 'no-store' });

    if (r.status === 401) { deconnexion(); return; }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));

    // L'utilisateur a changé d'année pendant le chargement : on garde en cache, sans afficher
    DASH_CACHE[an] = d.events || [];
    if (an !== DASH_YEAR) return;

    DASH = DASH_CACHE[an];
    DASH_ERR = '';
    DASH_LOADED = true;

    // Nouveaux statuts rencontrés : actifs par défaut seulement s'ils sont « utiles »
    DASH.forEach(e => {
      const k = e.statut || '—';
      if (!(k in DASH_ST)) DASH_ST[k] = STATUTS_DEFAUT.includes(k);
    });

    dashSousTitre(d.last_update);
    if (VIEW === 'dash') rendre();

  } catch (e) {
    if (an !== DASH_YEAR) return;
    DASH_ERR = e.message;
    if (VIEW === 'dash') rendre();
  }
}

/** Change d'année dans le tableau de bord (et cale le calendrier sur cette année). */
function dashSetYear(y, mois) {
  if (y < YEAR_MIN || y > YEAR_MAX) return;
  DASH_YEAR = y;
  CAL_REF = new Date(y, mois ?? (y === TODAY.getFullYear() ? TODAY.getMonth() : 0), 1);
  chargerDash();
}

function deconnexion() {
  CODE = '';
  try { localStorage.removeItem('agenda_code'); } catch {}
  document.getElementById('app').hidden  = true;
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('gateErr').textContent = 'Code refusé. Réessaie.';
}

// ══════════════════════════════════════════════════════════════════
//  Rendu
// ══════════════════════════════════════════════════════════════════

function rendre() {
  const main = document.getElementById('main');

  if (VIEW === 'dash') {
    if (DASH_ERR) {
      main.innerHTML = `<div class="state"><strong>Chargement impossible</strong>
        ${esc(DASH_ERR)}<br>Vérifie ta connexion et réessaie.</div>`;
      return;
    }
    if (!DASH_LOADED) { return; }
    CUR_LIST = DASH;
    main.innerHTML = htmlDash();
    brancherDash();
    return;
  }

  CUR_LIST = EVENTS;
  const warn = ERRORS.length
    ? `<div class="warn">Une source n'a pas répondu : ${esc(ERRORS.join(' · '))}</div>`
    : '';
  main.innerHTML = warn + (VIEW === 'list' ? htmlListe() : htmlCalendrier());
  if (VIEW === 'cal') brancherCalendrier();
}

/* ─── Détails d'un chrono (étiquettes colorées, équipe) ─── */

/** Étiquettes : techno (bleu), type (violet), matériel (gris), tâches Notion (jaune : Dossards, Collage des puces…). */
function chipsEv(ev) {
  const g = (arr, cls) => (arr || []).map(t => `<span class="tag ${cls}">${esc(t)}</span>`).join('');
  const taches = (ev.tags || []).filter(t => t !== 'Chrono'); // « Chrono » = tous, inutile de le répéter
  return g(ev.techno, 't-techno') + g(ev.type, 't-type') + g(ev.materiel, 't-mat') + g(taches, 't-tache');
}

/** « 👤 avec Paul, Romain » ou « 👤 seul » (agenda : chronos où je suis affecté). */
function equipeLigne(ev) {
  if (ev.source !== 'notion' || !Array.isArray(ev.autres)) return '';
  return ev.autres.length
    ? `<div class="ev-team">👤 avec <strong>${esc(ev.autres.join(', '))}</strong></div>`
    : `<div class="ev-team solo">👤 seul sur ce chrono</div>`;
}

/* ─── Liste ─── */

function htmlListe() {
  const evs = visibles()
    .filter(e => { const d = dayOf(e.start); return d && d >= TODAY; })
    .sort((a, b) => a.start.localeCompare(b.start));

  if (!evs.length) {
    return `<div class="state"><strong>Rien à venir</strong>
            Aucun événement dans les sources sélectionnées.</div>`;
  }

  let html = '', moisCourant = '';

  for (const ev of evs) {
    const d   = dayOf(ev.start);
    const mois = `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;

    if (mois !== moisCourant) {
      html += `<div class="month-sep">${mois}</div>`;
      moisCourant = mois;
    }

    const auj  = sameDay(d, TODAY);
    const h    = heure(ev);
    const fin  = dayOf(ev.end);
    const duree = (ev.allDay && fin && fin > d)
      ? `→ ${fin.getDate()} ${MONTHS[fin.getMonth()].slice(0,4)}.` : '';

    const meta = [
      LBL[ev.source],
      h,
      duree,
      ev.lieu ? '📍 ' + esc(ev.lieu) : '',
      ev.calendrier && ev.source === 'google' ? esc(ev.calendrier) : '',
      ev.statut ? `<span class="badge stat st-${stSlug(ev.statut)}">${esc(ev.statut)}</span>` : '',
    ].filter(Boolean).map(x => `<span>${x}</span>`).join('');

    const tags = chipsEv(ev);

    const tag = ev.url ? 'a' : 'div';
    const attrs = ev.url ? ` href="${esc(ev.url)}" target="_blank" rel="noopener"` : '';

    html += `
      <${tag}${attrs} class="ev ${CLS[ev.source]}${auj ? ' today' : ''}">
        <div class="ev-date">
          <div class="ev-day">${d.getDate()}</div>
          <div class="ev-dow">${DOW_S[d.getDay()]}</div>
        </div>
        <div class="ev-body">
          <div class="ev-title">${esc(ev.title)}
            ${auj ? '<span class="badge-today">AUJOURD\'HUI</span>' : ''}
          </div>
          <div class="ev-meta">${meta}</div>
          ${equipeLigne(ev)}
          ${tags ? `<div class="ev-tags">${tags}</div>` : ''}
        </div>
      </${tag}>`;
  }

  return html;
}

/* ─── Calendrier ─── */

function htmlCalendrier() {
  const an   = CAL_REF.getFullYear();
  const mois = CAL_REF.getMonth();

  const premier = new Date(an, mois, 1);
  // Lundi = premier jour de la semaine
  const decal = (premier.getDay() + 6) % 7;
  const debut = new Date(an, mois, 1 - decal);

  const evs = VIEW === 'dash' ? dashVisibles() : visibles();

  let cells = '';

  for (let i = 0; i < 42; i++) {
    const jour = new Date(debut.getFullYear(), debut.getMonth(), debut.getDate() + i);
    const hors = jour.getMonth() !== mois;
    const we   = jour.getDay() === 0 || jour.getDay() === 6;
    const auj  = sameDay(jour, TODAY);

    const duJour = evs.filter(e => couvre(e, jour));

    const items = duJour.slice(0, 3).map(e => {
      const idx = CUR_LIST.indexOf(e);
      return `<div class="cal-ev ${clsEv(e)}" data-i="${idx}"
                   title="${esc(e.title)}">${esc(e.title)}</div>`;
    }).join('');

    const reste = duJour.length > 3
      ? `<div class="cal-more">+${duJour.length - 3}</div>` : '';

    cells += `
      <div class="cal-cell${hors ? ' out' : ''}${we ? ' we' : ''}${auj ? ' today' : ''}">
        <div class="cal-num">${jour.getDate()}</div>
        ${items}${reste}
      </div>`;
  }

  return `
    <div class="cal-nav">
      <h2>${MONTHS[mois]} ${an}</h2>
      <div>
        <button class="btn-icon" id="calPrev" aria-label="Mois précédent">‹</button>
        <button class="btn-icon" id="calToday" aria-label="Aujourd'hui">•</button>
        <button class="btn-icon" id="calNext" aria-label="Mois suivant">›</button>
      </div>
    </div>
    <div class="cal-grid">
      ${DOW.map(d => `<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>`;
}

function brancherCalendrier() {
  // Dans le tableau de bord, passer de décembre à janvier change d'année (et recharge)
  const aller = n => {
    if (VIEW === 'dash' && n.getFullYear() !== DASH_YEAR) dashSetYear(n.getFullYear(), n.getMonth());
    else { CAL_REF = n; rendre(); }
  };
  document.getElementById('calPrev').onclick = () =>
    aller(new Date(CAL_REF.getFullYear(), CAL_REF.getMonth() - 1, 1));
  document.getElementById('calNext').onclick = () =>
    aller(new Date(CAL_REF.getFullYear(), CAL_REF.getMonth() + 1, 1));
  document.getElementById('calToday').onclick = () => aller(new Date());

  document.querySelectorAll('.cal-ev').forEach(el => {
    el.onclick = () => detail(CUR_LIST[+el.dataset.i]);
  });
}

/* ─── Tableau de bord ─── */

const lblStatut = s => s === '—' ? 'Sans statut' : s;

function htmlDash() {
  const an        = DASH_YEAR;
  const courante  = an === TODAY.getFullYear();

  // Portée (tous / mes chronos) appliquée, statuts pas encore : sert aux compteurs des pastilles
  const base = DASH.filter(e => DASH_SCOPE === 'all' || e.mine);
  const evs  = dashVisibles();

  const nbParStatut = {};
  base.forEach(e => { const k = e.statut || '—'; nbParStatut[k] = (nbParStatut[k] || 0) + 1; });
  const statuts = Object.keys(nbParStatut).sort(ordreStatut);

  const aVenir = evs.filter(e => { const d = dayOf(e.start); return d && d >= TODAY; });
  const ceMois = evs.filter(e => { const d = dayOf(e.start); return d && d.getMonth() === TODAY.getMonth(); });
  const pourMoi = evs.filter(e => e.mine);

  // « À affecter » : Validé / Validé non signé / Option sans chronométreur
  // (pour l'année en cours : seulement ce qui reste à venir)
  const aAffecter = DASH.filter(e => {
    const d = dayOf(e.start);
    return d && (!courante || d >= TODAY) && !e.nb_chrono &&
           ['Validé', 'Validé non signé', 'Option'].includes(e.statut);
  });

  const kpi = (n, l, cls = '') =>
    `<div class="kpi ${cls}"><b>${n}</b><span>${l}</span></div>`;

  const kpis = `<div class="kpis">
    ${kpi(evs.length, `chronos en ${an}`)}
    ${courante ? kpi(aVenir.length, 'à venir') : ''}
    ${courante ? kpi(ceMois.length, 'ce mois-ci') : ''}
    ${DASH_SCOPE === 'all' ? kpi(pourMoi.length, 'pour moi') : ''}
    ${kpi(aAffecter.length, 'à affecter', aAffecter.length ? 'alert' : '')}
  </div>`;

  // --- Histogramme mensuel : moi / autres ------------------------------
  const parMois = Array.from({ length: 12 }, () => ({ moi: 0, autres: 0 }));
  for (const e of evs) {
    const d = dayOf(e.start);
    if (!d || d.getFullYear() !== an) continue;
    parMois[d.getMonth()][e.mine ? 'moi' : 'autres']++;
  }
  const max = Math.max(1, ...parMois.map(m => m.moi + m.autres));

  const colonnes = parMois.map((m, i) => {
    const tot = m.moi + m.autres;
    const h = v => (v / max * 100).toFixed(1) + '%';
    return `<div class="bar-col${courante && i === TODAY.getMonth() ? ' cur' : ''}">
      <div class="bar-val">${tot || ''}</div>
      <div class="bar" style="height:${h(tot)}">
        <i class="b-others" style="height:${tot ? (m.autres / tot * 100).toFixed(1) : 0}%"></i>
        <i class="b-mine"   style="height:${tot ? (m.moi    / tot * 100).toFixed(1) : 0}%"></i>
      </div>
      <div class="bar-lbl">${MONTHS[i].slice(0, 3)}.</div>
      <div class="bar-moi" title="Mes chronos">${m.moi || '·'}</div>
    </div>`;
  }).join('');

  const histo = `<div class="panel">
    <h3>Chronos par mois — ${an}</h3>
    <div class="bars">${colonnes}</div>
    <div class="legend">
      <span><i style="background:var(--chrono)"></i>Moi (nombre en orange sous le mois)</span>
      <span><i style="background:#4a5170"></i>Autres</span>
    </div>
  </div>`;

  // --- Contrôles ---------------------------------------------------
  const annee = `<div class="cal-nav">
    <h2>${an}</h2>
    <div>
      <button class="btn-icon" id="yPrev"  aria-label="Année précédente" ${an <= YEAR_MIN ? 'disabled' : ''}>‹</button>
      <button class="btn-icon" id="yToday" aria-label="Année en cours">•</button>
      <button class="btn-icon" id="yNext"  aria-label="Année suivante" ${an >= YEAR_MAX ? 'disabled' : ''}>›</button>
    </div>
  </div>`;

  const scope = `<div class="seg" id="dashScope">
    <button data-v="all"  aria-pressed="${DASH_SCOPE === 'all'}">Tous les chronos</button>
    <button data-v="mine" aria-pressed="${DASH_SCOPE === 'mine'}">Mes chronos</button>
  </div>`;

  const chips = statuts.length ? `<div class="st-filters" id="dashStat">${
    statuts.map(s => `
      <button class="st-chip st-${stSlug(s)}" data-s="${esc(s)}" aria-pressed="${DASH_ST[s] !== false}">
        <span class="dot"></span>${esc(lblStatut(s))} <span class="n">${nbParStatut[s]}</span>
      </button>`).join('')
  }</div>` : '';

  const sub = `<div class="seg" id="dashSub">
    <button data-v="stats" aria-pressed="${DASH_SUB === 'stats'}">📊 Stats</button>
    <button data-v="list"  aria-pressed="${DASH_SUB === 'list'}">Liste</button>
    <button data-v="cal"   aria-pressed="${DASH_SUB === 'cal'}">Calendrier</button>
  </div>`;

  const quand = (courante && DASH_SUB === 'list') ? `<div class="seg" id="dashWhen">
    <button data-v="upcoming" aria-pressed="${DASH_WHEN === 'upcoming'}">À venir</button>
    <button data-v="all"      aria-pressed="${DASH_WHEN === 'all'}">Toute l'année</button>
  </div>` : '';

  const liste = (courante && DASH_WHEN === 'upcoming') ? aVenir : evs;

  const corps = DASH_SUB === 'stats' ? htmlStats()
              : DASH_SUB === 'list'  ? htmlDashListe(liste)
              : htmlCalendrier();
  // En mode Stats, les compteurs du haut sont repris et détaillés plus bas : on garde seulement l'histogramme
  return annee + scope + chips + (DASH_SUB === 'stats' ? '' : kpis) + histo + sub + quand + corps;
}

function htmlDashListe(liste) {
  if (!liste.length) {
    return `<div class="state"><strong>Aucun chrono</strong>
            Rien ne correspond aux filtres sélectionnés pour ${DASH_YEAR}.</div>`;
  }

  liste = [...liste].sort((a, b) => a.start.localeCompare(b.start));
  let html = '', moisCourant = '';

  for (const ev of liste) {
    const d    = dayOf(ev.start);
    const mois = `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    if (mois !== moisCourant) {
      html += `<div class="month-sep">${mois}</div>`;
      moisCourant = mois;
    }

    const auj  = sameDay(d, TODAY);
    const fin  = dayOf(ev.end);
    const duree = (fin && fin > d) ? `→ ${fin.getDate()} ${MONTHS[fin.getMonth()].slice(0,4)}.` : '';
    const equipe = ev.chronometreurs && ev.chronometreurs.length
      ? '👤 ' + esc(ev.chronometreurs.join(', '))
      : '<span class="no-team">⚠ non affecté</span>';

    const meta = [
      ev.statut ? `<span class="badge stat">${esc(ev.statut)}</span>` : '',
      ev.mine   ? '<span class="badge moi">MOI</span>' : '',
      duree ? esc(duree) : '',
      equipe,
    ].filter(Boolean).map(x => `<span>${x}</span>`).join('');

    const tags = chipsEv(ev);

    const tag = ev.url ? 'a' : 'div';
    const attrs = ev.url ? ` href="${esc(ev.url)}" target="_blank" rel="noopener"` : '';

    html += `
      <${tag}${attrs} class="ev ${clsEv(ev)}${auj ? ' today' : ''}">
        <div class="ev-date">
          <div class="ev-day">${d.getDate()}</div>
          <div class="ev-dow">${DOW_S[d.getDay()]}</div>
        </div>
        <div class="ev-body">
          <div class="ev-title">${esc(ev.title)}
            ${auj ? '<span class="badge-today">AUJOURD\'HUI</span>' : ''}
          </div>
          <div class="ev-meta">${meta}</div>
          ${tags ? `<div class="ev-tags">${tags}</div>` : ''}
        </div>
      </${tag}>`;
  }

  return html;
}

function brancherDash() {
  const an = DASH_YEAR;
  document.getElementById('yPrev').onclick  = () => dashSetYear(an - 1);
  document.getElementById('yNext').onclick  = () => dashSetYear(an + 1);
  document.getElementById('yToday').onclick = () => dashSetYear(TODAY.getFullYear(), TODAY.getMonth());

  document.querySelectorAll('#dashScope button').forEach(b => {
    b.onclick = () => { DASH_SCOPE = b.dataset.v; rendre(); };
  });
  document.querySelectorAll('#dashSub button').forEach(b => {
    b.onclick = () => { DASH_SUB = b.dataset.v; rendre(); };
  });
  document.querySelectorAll('#dashWhen button').forEach(b => {
    b.onclick = () => { DASH_WHEN = b.dataset.v; rendre(); };
  });
  document.querySelectorAll('#dashStat .st-chip').forEach(b => {
    b.onclick = () => {
      const s = b.dataset.s;
      DASH_ST[s] = DASH_ST[s] === false;
      rendre();
    };
  });
  if (DASH_SUB === 'cal') brancherCalendrier();
  if (DASH_SUB === 'stats') {
    chargerAnnees();
    chargerPerdus();
    // Toucher une année du comparatif l'ouvre
    document.querySelectorAll('.hrow[data-y]').forEach(r => {
      r.style.cursor = 'pointer';
      r.onclick = () => { window.scrollTo(0, 0); dashSetYear(+r.dataset.y); };
    });
  }
}

/* ─── Statistiques ─── */

const filtreDash = liste => liste.filter(e =>
  (DASH_SCOPE === 'all' || e.mine) && DASH_ST[e.statut || '—'] !== false);

const nbJours = ev => {
  const d = dayOf(ev.start), f = dayOf(ev.end);
  return d ? (f && f >= d ? Math.round((f - d) / 864e5) + 1 : 1) : 0;
};
const cleJour = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const dateLongue = d => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
const pluriel = (n, s, p) => `${n} ${n > 1 ? (p || s + 's') : s}`;

function chaqueJour(ev, fn) {
  const d = dayOf(ev.start); if (!d) return;
  const f = dayOf(ev.end) || d;
  const n = Math.min(40, Math.max(0, Math.round((f - d) / 864e5)));
  for (let i = 0; i <= n; i++) fn(new Date(d.getFullYear(), d.getMonth(), d.getDate() + i));
}

/** Compte les valeurs d'un champ (techno, type, équipe…) : [{l, n, j}] triés. */
function compter(evs, get) {
  const m = {};
  for (const e of evs) {
    for (const v of new Set(get(e) || [])) {
      if (!v) continue;
      m[v] = m[v] || { l: v, n: 0, j: 0 };
      m[v].n++; m[v].j += nbJours(e);
    }
  }
  return Object.values(m).sort((a, b) => b.n - a.n || b.j - a.j || a.l.localeCompare(b.l));
}

function hbars(items, cls = '', wide = false) {
  if (!items.length) return '<div class="note">Aucune donnée</div>';
  const max = Math.max(...items.map(i => i.n));
  return `<div class="hbars${wide ? ' wide' : ''}">` + items.map(i => `
    <div class="hrow">
      <span class="hl" title="${esc(i.l)}">${esc(i.l)}</span>
      <span class="ht"><i class="${i.cls || cls}" style="width:${(i.n / max * 100).toFixed(1)}%"></i></span>
      <span class="hn">${i.n}${i.sub ? `<small>${esc(i.sub)}</small>` : ''}</span>
    </div>`).join('') + '</div>';
}

const panel = (titre, corps, note = '') =>
  `<div class="panel"><h3>${esc(titre)}</h3>${corps}${note ? `<div class="legend">${note}</div>` : ''}</div>`;

const jx = ev => {
  const d = dayOf(ev.start), f = dayOf(ev.end) || d;
  const n = Math.round((d - TODAY) / 864e5);
  if (n > 0) return 'J-' + n;
  return f >= TODAY ? (n === 0 ? 'Auj.' : 'En cours') : 'Passé';
};

function ligneMini(ev, bonus = '') {
  const d = dayOf(ev.start);
  const equipe = ev.chronometreurs && ev.chronometreurs.length
    ? '👤 ' + esc(ev.chronometreurs.join(', ')) : '⚠ non affecté';
  const tag = ev.url ? 'a' : 'div';
  const at  = ev.url ? ` href="${esc(ev.url)}" target="_blank" rel="noopener"` : '';
  return `<${tag}${at} class="mini ${'st-' + stSlug(ev.statut)}">
    <span class="jx">${jx(ev)}</span>
    <span class="mt">${esc(ev.title)}<small>${dateLongue(d)} · ${esc(ev.statut || 'sans statut')} · ${equipe}</small></span>
    ${bonus}
  </${tag}>`;
}

/** Cases « calendrier de charge » façon GitHub : une case par jour, plus c'est orange, plus c'est chargé. */
function htmlHeat(evs, an) {
  const parJour = {};
  for (const e of evs) chaqueJour(e, d => { if (d.getFullYear() === an) parJour[cleJour(d)] = (parJour[cleJour(d)] || 0) + 1; });

  const jan1 = new Date(an, 0, 1);
  const off = (jan1.getDay() + 6) % 7; // lundi = 0
  const nbj = (new Date(an + 1, 0, 1) - jan1) / 864e5;
  const cols = Math.ceil((off + nbj) / 7);

  let cases = '';
  for (let c = 0; c < cols; c++) for (let r = 0; r < 7; r++) {
    const k = c * 7 + r - off;
    if (k < 0 || k >= nbj) { cases += '<i class="h0 vide"></i>'; continue; }
    const d = new Date(an, 0, 1 + k), n = parJour[cleJour(d)] || 0;
    cases += `<i class="h${Math.min(n, 4)}${sameDay(d, TODAY) ? ' auj' : ''}" title="${dateLongue(d)} : ${n ? pluriel(n, 'chrono') : 'rien'}"></i>`;
  }
  const mois = MONTHS.map((m, i) => {
    const col = Math.floor((off + (new Date(an, i, 1) - jan1) / 864e5) / 7);
    return `<span style="left:${(col / cols * 100).toFixed(2)}%">${m.slice(0, 3)}.</span>`;
  }).join('');

  const jours = Object.keys(parJour).length;
  return panel(`Calendrier de charge — ${an}`,
    `<div class="heatwrap"><div class="heatm">${mois}</div>
     <div class="heat" style="grid-template-columns:repeat(${cols},1fr)">${cases}</div></div>`,
    `<span>${pluriel(jours, 'jour')} avec chrono</span><span class="heatleg">moins <i class="h1"></i><i class="h2"></i><i class="h3"></i><i class="h4"></i> plus</span>`);
}

/** Un chronométreur sur deux chronos le même jour (ou plus de 3 chronos en parallèle). */
function conflits() {
  const actifs = DASH.filter(e => DASH_ST[e.statut || '—'] !== false);
  const courante = DASH_YEAR === TODAY.getFullYear();
  const m = {};
  for (const e of actifs) {
    if (!e.chronometreurs || !e.chronometreurs.length) continue;
    chaqueJour(e, d => {
      if (courante && d < TODAY) return;
      for (const nom of e.chronometreurs) {
        const k = nom + '|' + cleJour(d);
        (m[k] = m[k] || { nom, d, evs: new Set() }).evs.add(e);
      }
    });
  }
  return Object.values(m).filter(x => x.evs.size > 1).sort((a, b) => a.d - b.d || a.nom.localeCompare(b.nom));
}

function htmlComparatif(evsBrut) {
  const ya = TODAY.getFullYear();
  const lignes = [];
  for (let y = YEAR_MIN; y <= ya + 3; y++) {
    const liste = DASH_CACHE[y];
    if (!liste) { if (y <= ya + 1) lignes.push({ y, charge: false }); continue; }
    const f = filtreDash(liste);
    if (y > ya && !f.length) continue;
    lignes.push({ y, charge: true, n: f.length, moi: f.filter(e => e.mine).length, j: f.reduce((s, e) => s + nbJours(e), 0), liste: f });
  }
  const max = Math.max(1, ...lignes.map(l => l.n || 0));
  const md = d => d.getMonth() * 100 + d.getDate();
  const auj = md(TODAY);

  let delta = '';
  const cur = lignes.find(l => l.y === ya), prev = lignes.find(l => l.y === ya - 1);
  if (cur && prev && cur.charge && prev.charge) {
    const aDate = l => l.liste.filter(e => { const d = dayOf(e.start); return d && md(d) <= auj; }).length;
    const a = aDate(cur), b = aDate(prev), diff = a - b;
    delta = `<div class="delta ${diff >= 0 ? 'up' : 'down'}">À date (au ${dateLongue(TODAY)}) : <b>${a}</b> chronos en ${ya}
      contre <b>${b}</b> en ${ya - 1} <span>${diff > 0 ? '▲ +' + diff : diff < 0 ? '▼ ' + diff : '＝ pareil'}</span></div>`;
  }

  const corps = delta + '<div class="hbars">' + lignes.map(l => {
    if (!l.charge) return `<div class="hrow"><span class="hl">${l.y}</span><span class="ht"></span><span class="hn">…</span></div>`;
    const w = v => (v / max * 100).toFixed(1) + '%';
    return `<div class="hrow${l.y === DASH_YEAR ? ' sel' : ''}" data-y="${l.y}">
      <span class="hl">${l.y}</span>
      <span class="ht"><i class="h-autres" style="width:${w(l.n)}"><i class="h-moi" style="width:${l.n ? (l.moi / l.n * 100).toFixed(1) : 0}%"></i></i></span>
      <span class="hn">${l.n}<small>${l.moi} moi · ${l.j} j</small></span>
    </div>`;
  }).join('') + '</div>';

  const ok = lignes.every(l => l.charge);
  return panel('Année après année', corps,
    `<span><i style="background:var(--chrono)"></i>Moi</span><span><i style="background:#4a5170"></i>Autres</span><span>Touche une année pour l'ouvrir${ok ? '' : ' · chargement…'}</span>`);
}

function htmlStats() {
  const an = DASH_YEAR, courante = an === TODAY.getFullYear();
  const base = DASH.filter(e => DASH_SCOPE === 'all' || e.mine);   // tous statuts
  const evs  = dashVisibles();
  const parts = [];

  // 1. Prochains départs ------------------------------------------------
  if (courante) {
    const suite = evs.filter(e => (dayOf(e.end) || dayOf(e.start)) >= TODAY)
                     .sort((a, b) => a.start.localeCompare(b.start)).slice(0, 4);
    if (suite.length) parts.push(panel('Prochains chronos', suite.map(e => ligneMini(e)).join('')));
  }

  // 2. Chiffres clés ---------------------------------------------------
  const jours = evs.reduce((s, e) => s + nbJours(e), 0);
  const parMois = Array(12).fill(0);
  evs.forEach(e => { const d = dayOf(e.start); if (d && d.getFullYear() === an) parMois[d.getMonth()]++; });
  const moisMax = Math.max(...parMois);
  const affectes = evs.filter(e => e.nb_chrono);
  const tailleMoy = affectes.length ? (affectes.reduce((s, e) => s + e.nb_chrono, 0) / affectes.length) : 0;
  let we = 0;
  const parDow = Array(7).fill(0), parJour = {};
  for (const e of evs) chaqueJour(e, d => {
    if (d.getFullYear() !== an) return;
    parDow[(d.getDay() + 6) % 7]++;
    parJour[cleJour(d)] = (parJour[cleJour(d)] || { d, n: 0 }); parJour[cleJour(d)].n++;
    if (d.getDay() === 0 || d.getDay() === 6) we++;
  });
  const k = (n, l, c = '') => `<div class="kpi ${c}"><b>${n}</b><span>${l}</span></div>`;
  parts.push(`<div class="kpis">
    ${k(evs.length, 'chronos')}
    ${k(jours, 'jours de chrono')}
    ${k((evs.length / 12).toFixed(1).replace('.', ','), 'par mois en moyenne')}
    ${k(moisMax ? MONTHS[parMois.indexOf(moisMax)].slice(0, 4) + '. · ' + moisMax : '—', 'mois record')}
    ${k(we, 'jours de week-end')}
    ${k(tailleMoy ? tailleMoy.toFixed(1).replace('.', ',') : '—', 'chronométreurs par chrono')}
  </div>`);

  // 3. À relancer / à signer --------------------------------------------
  const relance = base.filter(e => ['Option', 'Validé non signé'].includes(e.statut) &&
                                   (dayOf(e.end) || dayOf(e.start)) >= TODAY)
                      .sort((a, b) => a.start.localeCompare(b.start));
  if (relance.length) {
    parts.push(panel(`À relancer ou à faire signer (${relance.length})`,
      relance.slice(0, 6).map(e => ligneMini(e)).join('') +
      (relance.length > 6 ? `<div class="note">+ ${relance.length - 6} autres (voir l'onglet Liste)</div>` : '')));
  }

  // 4. Alertes planning -----------------------------------------------
  const alertes = [];
  const cf = conflits();
  if (cf.length) {
    const lignes = cf.slice(0, 5).map(x => `<div class="al">⚠ <b>${esc(x.nom)}</b> · ${dateLongue(x.d)} : ${[...x.evs].map(e => esc(e.title)).join(' + ')}</div>`).join('');
    alertes.push(`<h4>Chronométreur sur 2 chronos le même jour (${cf.length})</h4>${lignes}${cf.length > 5 ? `<div class="note">+ ${cf.length - 5} autres</div>` : ''}`);
  }
  const sansEquipe = evs.filter(e => !e.nb_chrono && (!courante || (dayOf(e.end) || dayOf(e.start)) >= TODAY) &&
                                    ['Validé', 'Validé non signé'].includes(e.statut));
  if (sansEquipe.length) {
    alertes.push(`<h4>Validés sans chronométreur (${sansEquipe.length})</h4>` +
      sansEquipe.slice(0, 5).map(e => `<div class="al">⚠ ${dateLongue(dayOf(e.start))} · ${esc(e.title)}</div>`).join(''));
  }
  const dense = Object.values(parJour).filter(x => x.n >= 3 && (!courante || x.d >= TODAY)).sort((a, b) => a.d - b.d);
  if (dense.length) {
    alertes.push(`<h4>Jours avec 3 chronos ou plus (${dense.length})</h4>` +
      dense.slice(0, 4).map(x => `<div class="al">📍 ${dateLongue(x.d)} : ${x.n} chronos en parallèle</div>`).join(''));
  }
  if (alertes.length) parts.push(panel('Alertes planning', alertes.join('')));
  else parts.push(panel('Alertes planning', '<div class="note ok">✓ Rien à signaler : pas de doublon, pas de chrono validé sans équipe.</div>'));

  // 5. Calendrier de charge + année après année ------------------------
  parts.push(htmlHeat(evs, an));
  parts.push(htmlComparatif());

  // 6. Pipeline ------------------------------------------------------
  const nbSt = {};
  base.forEach(e => { const s = e.statut || '—'; nbSt[s] = (nbSt[s] || 0) + 1; });
  // Perdus / annulés dont la date a été effacée : rattachés à l'année de création de la fiche
  const sd = DASH_SCOPE === 'all' ? (PERDUS_LIST || []).filter(e => e.an === an) : [];
  sd.forEach(e => { nbSt[e.statut] = (nbSt[e.statut] || 0) + 1; });
  const stOrdre = Object.keys(nbSt).sort(ordreStatut);
  const tot = (base.length + sd.length) || 1;
  const concl = (nbSt['Validé'] || 0) + (nbSt['Validé non signé'] || 0);
  const perdu = (nbSt['Perdu'] || 0) + (nbSt['Annulé'] || 0);
  const taux = concl + perdu ? Math.round(concl / (concl + perdu) * 100) : null;
  parts.push(panel(`Pipeline ${an}`,
    `<div class="stack">${stOrdre.map(s => `<i class="st-${stSlug(s)}" style="width:${(nbSt[s] / tot * 100).toFixed(1)}%" title="${esc(lblStatut(s))} : ${nbSt[s]}"></i>`).join('')}</div>
     <div class="stlist">${stOrdre.map(s => `<span class="st-${stSlug(s)}"><i></i>${esc(lblStatut(s))} <b>${nbSt[s]}</b></span>`).join('')}</div>` +
    (taux !== null ? `<div class="delta">Taux de conclusion : <b>${taux} %</b> <span>(${concl} concrétisés contre ${perdu} perdus ou annulés, options en attente non comptées)</span></div>` : '') +
    (sd.length ? `<div class="note">${sd.length} fiches sans date (perdues, annulées, reportées…) sont rattachées à l'année de l'événement${
      sd.some(e => e.source === 'creation') ? ` (retrouvée via la synchro Google Agenda ; pour ${sd.filter(e => e.source === 'creation').length} d'entre elles, année de création de la fiche à défaut)` : ' (retrouvée via la synchro Google Agenda)'}.</div>` : '')));

  // 7. Équipe -------------------------------------------------------
  const eq = compter(evs, e => e.chronometreurs);
  const tailles = [0, 0, 0, 0];
  evs.forEach(e => tailles[Math.min(e.nb_chrono || 0, 3)]++);
  const paires = {};
  evs.forEach(e => {
    const ns = [...new Set(e.chronometreurs || [])].sort();
    for (let i = 0; i < ns.length; i++) for (let j = i + 1; j < ns.length; j++) {
      const c = ns[i].split(' ')[0] + ' + ' + ns[j].split(' ')[0]; paires[c] = (paires[c] || 0) + 1;
    }
  });
  const topPaires = Object.entries(paires).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([l, n]) => ({ l, n, cls: 'h-moi' }));
  const mesChronos = DASH.filter(e => e.mine && DASH_ST[e.statut || '—'] !== false);
  if (mesChronos.length) {
    const avec = compter(mesChronos, e => e.autres || []);
    const seuls = mesChronos.filter(e => !(e.autres || []).length).length;
    parts.push(panel(`Avec qui je fais équipe (${mesChronos.length} chronos)`,
      hbars(avec.slice(0, 10).map(x => ({ l: x.l, n: x.n, sub: `${x.j} j ensemble` })), 'h-moi', true) +
      `<div class="chips-row"><span class="tag">seul sur <b>${seuls}</b></span>` +
      `<span class="tag">en équipe sur <b>${mesChronos.length - seuls}</b></span></div>`,
      '<span>Chronos où tu es affecté, selon les statuts cochés</span>'));
  }

  parts.push(panel('Équipe : qui chronomètre quoi',
    hbars(eq.slice(0, 8).map(x => ({ l: x.l, n: x.n, sub: `${x.j} j`, cls: x.l === monNom() ? 'h-moi' : 'h-autres' })), '', true) +
    `<div class="chips-row">
      <span class="tag">seul <b>${tailles[1]}</b></span><span class="tag">à 2 <b>${tailles[2]}</b></span>
      <span class="tag">à 3 et + <b>${tailles[3]}</b></span><span class="tag t-warn">non affecté <b>${tailles[0]}</b></span></div>` +
    (topPaires.length ? `<h4>Binômes les plus fréquents</h4>${hbars(topPaires, '', true)}` : ''),
    '<span>Nombre de chronos · jours de présence cumulés</span>'));

  // 8. Rythme & records -------------------------------------------------
  const semaines = {};
  evs.forEach(e => {
    const d = dayOf(e.start); if (!d || d.getFullYear() !== an) return;
    const l = new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7);
    const c = cleJour(l); semaines[c] = semaines[c] || { l, n: 0 }; semaines[c].n++;
  });
  const sMax = Object.values(semaines).sort((a, b) => b.n - a.n)[0];
  const jMax = Object.values(parJour).sort((a, b) => b.n - a.n || a.d - b.d)[0];
  let pause = { n: 0 }, run = 0, debut = null;
  for (let d = new Date(an, 0, 1); d.getFullYear() === an; d = new Date(an, d.getMonth(), d.getDate() + 1)) {
    if (parJour[cleJour(d)]) { run = 0; debut = null; }
    else { if (!run) debut = new Date(d); run++; if (run > pause.n) pause = { n: run, de: debut, a: new Date(d) }; }
  }
  const rec = (i, t, v) => `<div class="rec"><span>${i} ${t}</span><b>${v}</b></div>`;
  parts.push(panel('Rythme et records',
    hbars(parDow.map((n, i) => ({ l: DOW[i], n, cls: i >= 5 ? 'h-moi' : 'h-autres' }))) +
    '<div class="recs">' +
    (jMax ? rec('🔥', 'Jour le plus chargé', `${dateLongue(jMax.d)} · ${pluriel(jMax.n, 'chrono')}`) : '') +
    (sMax ? rec('📅', 'Semaine record', `du ${dateLongue(sMax.l)} · ${pluriel(sMax.n, 'chrono')}`) : '') +
    (pause.n > 1 ? rec('🌴', 'Plus longue pause', `${pluriel(pause.n, 'jour')} (${dateLongue(pause.de)} → ${dateLongue(pause.a)})`) : '') +
    '</div>', '<span>Jours couverts par un chrono, par jour de semaine (week-end en orange)</span>'));

  // 9. Répartitions --------------------------------------------------
  const rep = (titre, get, cls) => {
    const r = compter(evs, get).slice(0, 8);
    return r.length ? panel(titre, hbars(r.map(x => ({ l: x.l, n: x.n, sub: `${x.j} j` })), cls)) : '';
  };
  parts.push(rep('Par type de chrono', e => e.type, 'h-type'));
  parts.push(rep('Par technologie', e => e.techno, 'h-techno'));
  parts.push(rep('Matériel utilisé', e => e.materiel, 'h-mat'));
  parts.push(rep('Tâches et préparatifs', e => (e.tags || []).filter(t => t !== 'Chrono'), 'h-tache'));

  if (!evs.length) return '<div class="state"><strong>Aucun chrono</strong>Rien ne correspond aux filtres sélectionnés pour ' + an + '.</div>' + parts.slice(-1)[0];
  return parts.join('');
}

/** Charge en tâche de fond toutes les années pour le comparatif. */
let PERDUS_TENTE = false;
async function chargerPerdus() {
  if (PERDUS_TENTE) return;
  PERDUS_TENTE = true;
  try {
    const r = await fetch(`${API}?code=${encodeURIComponent(CODE)}&mode=perdus`, { cache: 'no-store' });
    if (!r.ok) return;
    PERDUS_LIST = (await r.json()).perdus || [];
    if (VIEW === 'dash' && DASH_SUB === 'stats') { const y = window.scrollY; rendre(); window.scrollTo(0, y); }
  } catch {}
}

let ANNEES_TENTEES = false;
async function chargerAnnees() {
  if (ANNEES_TENTEES) return;
  ANNEES_TENTEES = true;
  const manquantes = [];
  for (let y = YEAR_MIN; y <= TODAY.getFullYear() + 3; y++) if (!DASH_CACHE[y]) manquantes.push(y);
  await Promise.all(manquantes.map(async y => {
    try {
      const r = await fetch(`${API}?code=${encodeURIComponent(CODE)}&mode=chronos&year=${y}`, { cache: 'no-store' });
      if (!r.ok) return;
      const d = await r.json();
      DASH_CACHE[y] = d.events || [];
      DASH_CACHE[y].forEach(e => { const s = e.statut || '—'; if (!(s in DASH_ST)) DASH_ST[s] = STATUTS_DEFAUT.includes(s); });
    } catch {}
  }));
  if (VIEW === 'dash' && DASH_SUB === 'stats') { const y = window.scrollY; rendre(); window.scrollTo(0, y); }
}

/* ─── Détail ─── */

function detail(ev) {
  if (!ev) return;

  const d = dayOf(ev.start);
  const meta = [
    LBL[ev.source],
    `${DOW_S[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`,
    heure(ev),
    ev.lieu ? '📍 ' + esc(ev.lieu) : '',
    ev.statut ? esc(ev.statut) : '',
    ev.chronometreurs ? (ev.chronometreurs.length ? '👤 ' + esc(ev.chronometreurs.join(', ')) : '⚠ non affecté') : '',
  ].filter(Boolean).map(x => `<span>${x}</span>`).join('');

  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML = `
    <div class="sheet-box">
      <h3>${esc(ev.title)}</h3>
      <div class="ev-meta">${meta}</div>
      ${equipeLigne(ev)}
      ${chipsEv(ev) ? `<div class="ev-tags" style="margin-bottom:6px">${chipsEv(ev)}</div>` : ''}
      ${ev.url ? `<a href="${esc(ev.url)}" target="_blank" rel="noopener">Ouvrir</a>` : ''}
    </div>`;

  sheet.onclick = e => { if (e.target === sheet) sheet.remove(); };
  document.body.appendChild(sheet);
}

// ══════════════════════════════════════════════════════════════════
//  Interactions
// ══════════════════════════════════════════════════════════════════

function ouvrir(code) {
  CODE = code;
  try { localStorage.setItem('agenda_code', code); } catch {}
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').hidden = false;
  charger();
}

document.getElementById('gateBtn').onclick = () => {
  const v = document.getElementById('codeInput').value.trim();
  if (v) ouvrir(v);
};

document.getElementById('codeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('gateBtn').click();
});

document.getElementById('btnRefresh').onclick = () =>
  VIEW === 'dash' ? chargerDash(true, true) : charger(true);

function setView(v) {
  VIEW = v;
  for (const [id, nom] of [['tabList', 'list'], ['tabCal', 'cal'], ['tabDash', 'dash']]) {
    document.getElementById(id).setAttribute('aria-selected', String(nom === v));
  }
  // Les filtres par source ne concernent que l'agenda, pas le tableau de bord
  document.getElementById('srcFilters').hidden = (v === 'dash');

  if (v === 'dash') {
    if (!DASH_LOADED) { chargerDash(); }
    else { dashSousTitre(); rendre(); }
  } else {
    document.getElementById('sub').textContent = `${EVENTS.length} événements`;
    rendre();
  }
}

document.getElementById('tabList').onclick = () => setView('list');
document.getElementById('tabCal').onclick  = () => setView('cal');
document.getElementById('tabDash').onclick = () => setView('dash');

document.querySelectorAll('.filt').forEach(b => {
  b.onclick = () => {
    const s = b.dataset.src;
    ACTIVE[s] = !ACTIVE[s];
    b.setAttribute('aria-pressed', String(ACTIVE[s]));
    rendre();
  };
});

// ══════════════════════════════════════════════════════════════════
//  Démarrage — le code est retenu pour éviter de le retaper
// ══════════════════════════════════════════════════════════════════

(() => {
  let sauve = null;
  try { sauve = localStorage.getItem('agenda_code'); } catch {}
  if (sauve) ouvrir(sauve);
})();
</script>
</body>
</html>
